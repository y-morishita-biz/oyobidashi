# ブラウザで書き込むページを GitHub Pages に公開する。
# firmware.yml がタグ（v1.0.0 など）でビルドに成功したら、その材料（github-pages）を受け取って公開する。
# Pages の公開先は標準では main ブランチからしか受け付けないので、タグのビルドから直接ではなく、
# main で動くこのワークフローから公開する。
#
# 使う前に一度だけ：リポジトリの Settings → Pages → Source を「GitHub Actions」にする
name: pages

on:
  workflow_run:
    workflows: [firmware]
    types: [completed]

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: タグのビルドから書き込みページを受け取る
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: downloaded

      - name: 取り出す
        run: |
          mkdir -p site
          tar -xf downloaded/artifact.tar -C site
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
