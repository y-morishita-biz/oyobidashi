# call-button のファームウェアをビルドする。
#   - プッシュ・PR：ビルドできるかを確かめる（できたファイルは Actions の Artifacts からダウンロードできる）
#   - リリース：GitHub の Actions → firmware → Run workflow で、main を選び version に v1.0.0 などを入れて実行する。
#     タグとリリース（プレリリース）を作ってファームウェアを添付し、書き込みページを GitHub Pages に公開する
#     （Pages の公開先は標準で main からしか受け付けないので、タグのプッシュではなく main からの実行にしている）
#     Pages を使う前に一度だけ：Settings → Pages → Source を「GitHub Actions」にする
name: firmware

on:
  push:
    branches: ["**"]
    paths:
      - "call-button/**"
      - "tools/merge_bin.py"
      - "docs/flasher/**"
      - ".github/workflows/firmware.yml"
      - ".github/release-notes.md"
  pull_request:
    paths:
      - "call-button/**"
      - "tools/merge_bin.py"
      - "docs/flasher/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（v1.0.0 など）。空ならビルドだけする"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 秘密情報が入っていないか確かめる
        run: tools/check_secrets.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('call-button/platformio.ini') }}

      - name: PlatformIO を入れる
        run: pip install --upgrade platformio

      - name: バージョンを決める
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version は v1.0.0 の形で入れてください" >&2; exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "リリースは main から実行してください" >&2; exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: ビルド（配布用）
        working-directory: call-button
        env:
          PLATFORMIO_BUILD_FLAGS: -DOYOBI_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: |
          test ! -e include/secrets.h  # 配布用に secrets.h がまぎれ込まないように
          pio run -e release

      - name: 配るファイルをまとめる
        run: |
          mkdir -p dist
          cp call-button/.pio/build/release/oyobidashi-call-button.bin \
             "dist/oyobidashi-call-button-${{ steps.ver.outputs.version }}.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      # ブラウザで書き込むページ（ESP Web Tools はファームウェアを同じサイトから読むので、一緒に置く）
      - name: 書き込みページを組み立てる
        run: |
          mkdir -p site
          cp -r docs/flasher/. site/
          # 部品ごとに書く（1つにまとめたファイルだと、すき間にある本体の設定まで消えてしまうため）
          cp call-button/.pio/build/release/web/*.bin site/
          jq -n --arg v "${{ steps.ver.outputs.version }}" \
             --slurpfile parts call-button/.pio/build/release/web/parts.json '{
            name: "oyobidashi call-button",
            version: $v,
            new_install_prompt_erase: true,
            builds: [{ chipFamily: "ESP32-S3", parts: $parts[0] }]
          }' > site/manifest.json
          cat site/manifest.json
          sed -i "s/__VERSION__/${{ steps.ver.outputs.version }}/g" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  release:
    if: github.event.inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}（トライアル版）
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: true  # 実機未検証のトライアル版

  pages:
    if: github.event.inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
