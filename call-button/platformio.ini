; oyobidashi / call-button  (M5Dial)
[env:m5dial]
platform = espressif32 @ ^6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Dial @ ^1.0.3
    m5stack/M5Unified
    m5stack/M5GFX
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; 配布用（GitHub のリリースで配るファームウェア）。secrets.h を読まず、設定はすべて設定モードで入れる。
; サンプルの製品カードと QR の初期値は入れない。ビルドすると .pio/build/release/ に
; ブラウザや esptool で 0x0 番地に書き込める1つにまとめたファイル（oyobidashi-call-button.bin）ができる
;   pio run -e release
[env:release]
extends = env:m5dial
build_flags =
    ${env:m5dial.build_flags}
    -DOYOBI_RELEASE
extra_scripts = post:../tools/merge_bin.py
